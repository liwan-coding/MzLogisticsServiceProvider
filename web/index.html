<!DOCTYPE html>
<html>
<head>
  <!--
    If you are serving your web app in a path other than the root, change the
    href value below to reflect the base path you are serving from.

    The path provided below has to start and end with a slash "/" in order for
    it to work correctly.

    For more details:
    * https://developer.mozilla.org/en-US/docs/Web/HTML/Element/base

    This is a placeholder for base href that will be replaced by the value of
    the `--base-href` argument provided to `flutter build`.
  -->
  <base href="$FLUTTER_BASE_HREF">

  <meta charset="UTF-8">
  <meta content="IE=Edge" http-equiv="X-UA-Compatible">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <meta name="description" content="MoveX service provider operations for transportation companies.">

  <!-- iOS meta tags & icons -->
  <meta name="mobile-web-app-capable" content="yes">
  <meta name="theme-color" content="#00A6A6">
  <meta name="apple-mobile-web-app-status-bar-style" content="default">
  <meta name="apple-mobile-web-app-title" content="MoveX">
  <link rel="apple-touch-icon" href="icons/Icon-192.png">

  <!-- Favicon -->
  <link rel="icon" type="image/png" href="favicon.png"/>

  <title>MoveX</title>
  <link rel="manifest" href="manifest.json">
  <style>
    html, body {
      margin: 0;
      height: 100%;
      background: #003D3D;
    }

    /*
      The web embedder creates flt-glass-pane without a size, so the canvas
      stays invisible and this page background shows through as a blank field.
    */
    flt-glass-pane {
      position: absolute;
      inset: 0;
      display: block;
      width: 100%;
      height: 100%;
    }

    #splash {
      position: fixed;
      z-index: 1;
      inset: 0;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      gap: 14px;
      background: #003D3D;
      color: #F3FFFF;
      font-family: "Segoe UI", Tahoma, sans-serif;
    }

    #splash .mark {
      width: 64px;
      height: 64px;
      display: grid;
      place-items: center;
      border-radius: 10px;
      background: #FFC107;
      color: #142426;
      font-size: 22px;
      font-weight: 800;
    }

    #splash .name {
      margin: 0;
      font-size: 24px;
      font-weight: 700;
    }

    #splash .rule {
      width: 36px;
      height: 3px;
      border-radius: 20px;
      background: #FFC107;
    }

    #splash .bar {
      width: 88px;
      height: 2px;
      margin-top: 18px;
      overflow: hidden;
      border-radius: 20px;
      background: rgba(255, 255, 255, 0.18);
    }

    #splash .bar::after {
      content: "";
      display: block;
      width: 40%;
      height: 100%;
      background: #FFC107;
      animation: splash-load 1.1s ease-in-out infinite;
    }

    @keyframes splash-load {
      from { transform: translateX(-120%); }
      to { transform: translateX(280%); }
    }

    @media (prefers-reduced-motion: reduce) {
      #splash .bar::after {
        width: 100%;
        animation: none;
        transform: none;
      }
    }
  </style>
</head>
<body>
  <div id="splash" role="status" aria-label="MoveX">
    <div class="mark" aria-hidden="true">MX</div>
    <p class="name">MoveX</p>
    <div class="rule" aria-hidden="true"></div>
    <div class="bar" aria-hidden="true"></div>
  </div>
  <script src="flutter_bootstrap.js" async></script>
  <script>
    function hideSplash() {
      var splash = document.getElementById('splash');
      if (splash) splash.remove();
    }
    window.addEventListener('flutter-first-frame', hideSplash);
    document.addEventListener('flutter-first-frame', hideSplash);
  </script>
</body>
</html>
